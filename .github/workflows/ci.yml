name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11 (third-party: pinned to a commit)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit, property and golden-curve tests (JVM and Node)
        run: sbt -batch test
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build (bundle budget) and end-to-end tests
        run: npm run test:e2e
        working-directory: web
      - name: Sub-path build smoke test
        run: npm run test:e2e:subpath
        working-directory: web
      - name: Lighthouse
        working-directory: web
        run: |
          export CHROME_PATH="$(node -e 'import("@playwright/test").then(m => console.log(m.chromium.executablePath()))')"
          npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            web/test-results
            web/lighthouse
          if-no-files-found: ignore

  deploy:
    needs: test
    # a push to main, or "Run workflow" on main in the Actions tab; never a PR, and only once the user turns deploys on
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.OH_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11 (third-party: pinned to a commit)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: web
      - name: Build for the Pages URL
        run: npm run build
        working-directory: web
        env:
          OH_BASE: ${{ steps.pages.outputs.base_path }}/
          OH_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
