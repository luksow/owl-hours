version = 3.8.3
runner.dialect = scala3
maxColumn = 120

# Braceful style: never drop optional braces. The compiler's -no-indent (build.sbt) rejects indentation-based blocks;
# scalafmt's own switch for that (runner.dialectOverride.allowSignificantIndentation = false) also rejects valid
# braced code, so it is not used.
rewrite.scala3.removeOptionalBraces = false

# Close to the hand-written style the code started with: aligned `=` and `<-`,
# and doc comments left as they are.
align.preset = more
docstrings.style = Asterisk
docstrings.wrap = no
