<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#241219"/>
      <rect x="1" y="1" width="18" height="8" rx="1" fill="#2E1A22"/><rect x="21" y="1" width="18" height="8" rx="1" fill="#2B1820"/>
      <rect x="-9" y="11" width="18" height="8" rx="1" fill="#2C1921"/><rect x="11" y="11" width="18" height="8" rx="1" fill="#301B24"/>
      <rect x="31" y="11" width="18" height="8" rx="1" fill="#2A171F"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient>
    <radialGradient id="spill" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF3F8E" stop-opacity=".22"/><stop offset="1" stop-color="#FF3F8E" stop-opacity="0"/></radialGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".8" result="a"/><feGaussianBlur stdDeviation="2.2" result="b"/><feGaussianBlur stdDeviation="5" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#brick)"/>
  <rect width="100" height="100" fill="url(#vig)"/>
  <circle cx="50" cy="48" r="40" fill="url(#spill)"/>
  <!-- the mark at 0.8 around the centre keeps its ears inside the maskable circle; glow layer, then bright cores -->
  <g data-safe="" transform="translate(50 50) scale(0.8) translate(-50 -48)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#neon)" stroke-width="4.2">
      <path data-part="head" stroke="#FF3F8E" d="M30,76 C16,64 18,42 32,32 L24,12 L42,28 Q50,24 58,28 L76,12 L68,32 C82,42 84,64 70,76 C60,84 40,84 30,76 Z"/>
      <path stroke="#5CE1FF" d="M29,52 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 M51,52 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
      <path stroke="#5CE1FF" d="M36.4,52 a2.6,2.6 0 1,0 5.2,0 a2.6,2.6 0 1,0 -5.2,0 M58.4,52 a2.6,2.6 0 1,0 5.2,0 a2.6,2.6 0 1,0 -5.2,0"/>
      <path stroke="#FFB03B" d="M45.5,62 L50,68 L54.5,62"/>
    </g>
    <g stroke-width="1.6">
      <path stroke="#FFD2E3" d="M30,76 C16,64 18,42 32,32 L24,12 L42,28 Q50,24 58,28 L76,12 L68,32 C82,42 84,64 70,76 C60,84 40,84 30,76 Z"/>
      <path stroke="#E8FCFF" d="M29,52 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0 M51,52 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
      <path stroke="#E8FCFF" d="M36.4,52 a2.6,2.6 0 1,0 5.2,0 a2.6,2.6 0 1,0 -5.2,0 M58.4,52 a2.6,2.6 0 1,0 5.2,0 a2.6,2.6 0 1,0 -5.2,0"/>
      <path stroke="#FFF0CC" d="M45.5,62 L50,68 L54.5,62"/>
    </g>
  </g>
</svg>
